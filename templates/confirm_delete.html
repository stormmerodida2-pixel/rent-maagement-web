{% extends 'app_base.html' %}
{% block page_title %}Delete{% endblock %}
{% block content %}
<div class="form-page">
<div class="page-header"><div><h1>Delete {{ object }}?</h1><p class="sub">This can't be undone.</p></div></div>
<section class="card form-card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-actions" style="margin-top:0">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a class="btn btn-ghost" href="{% url 'rentals:dashboard' %}" data-history-back>Cancel</a>
      </div>
    </form>
  </div>
</section>
</div>
{% endblock %}
