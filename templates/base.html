{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script nonce="{{ csp_nonce }}">
    /* Apply the saved theme before the page paints, so there's no flash of the wrong colours. */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Collect rent over M-Pesa, track arrears and manage maintenance for your rental properties.{% endblock %}">
  <link rel="icon" type="image/jpeg" href="{% static 'img/logo-light.jpeg' %}">
  <link rel="apple-touch-icon" href="{% static 'img/icons/apple-touch-icon.png' %}">
  {% block manifest %}<link rel="manifest" href="{% url 'manifest' %}">{% endblock %}
  <meta name="theme-color" content="#0e7a4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ APP_NAME }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/features.css' %}">
  <script src="{% static 'js/theme.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block seo %}<meta name="robots" content="noindex, nofollow">{% endblock %}
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
</body>
</html>
