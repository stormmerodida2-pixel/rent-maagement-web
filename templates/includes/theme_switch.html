{% load ui %}<div class="theme-switch" role="group" aria-label="Colour theme">
  <button type="button" data-theme-choice="auto" aria-pressed="false" title="Match my device">{% icon 'monitor' %}<span class="visually-hidden">System</span></button>
  <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">{% icon 'sun' %}<span class="visually-hidden">Light</span></button>
  <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">{% icon 'moon' %}<span class="visually-hidden">Dark</span></button>
</div>
