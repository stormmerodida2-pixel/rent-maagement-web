{% load i18n ui %}<div class="theme-switch" role="group" aria-label="{% translate 'Colour theme' %}">
  <button type="button" data-theme-choice="auto" aria-pressed="false" title="{% translate 'Match my device' %}">{% icon 'monitor' %}<span class="visually-hidden">{% translate "System" %}</span></button>
  <button type="button" data-theme-choice="light" aria-pressed="false" title="{% translate 'Light' %}">{% icon 'sun' %}<span class="visually-hidden">{% translate "Light" %}</span></button>
  <button type="button" data-theme-choice="dark" aria-pressed="false" title="{% translate 'Dark' %}">{% icon 'moon' %}<span class="visually-hidden">{% translate "Dark" %}</span></button>
</div>
