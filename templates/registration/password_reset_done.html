{% extends 'registration/auth_card.html' %}
{% block title %}Check your email · {{ APP_NAME }}{% endblock %}
{% block card %}
<h1>Check your email</h1>
<p class="muted">If an account uses that address, a reset link is on its way. It can take a minute or two, so check spam too.</p>
<a class="btn btn-block" style="margin-top:20px" href="{% url 'login' %}">Back to log in</a>
{% endblock %}
