<form method="post" novalidate>{% csrf_token %}
  <input type="hidden" name="page" value="{{ page }}">
  {% for field in form.visible_fields %}
    {% if field.name == 'website' %}
      <div class="visually-hidden" aria-hidden="true"><label for="{{ field.id_for_label }}">Leave this empty</label>{{ field }}</div>
    {% else %}
      <div class="field{% if field.errors %} has-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}
      </div>
    {% endif %}
  {% endfor %}
  <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:18px">Send message</button>
</form>
